version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mvusys-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - mvusys-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mvusys-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - mvusys-network

networks:
  mvusys-network:
    driver: bridge
